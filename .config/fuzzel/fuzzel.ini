[main]
# Киллер-фича: запуск в режиме демона. 
# fuzzel будет висеть в RAM и мгновенно отрисовывать окно по IPC-сигналу.
daemon=yes

# Шрифт. ОБЯЗАТЕЛЬНО используй Nerd Font, иначе иконки приложений будут квадратиками.
# Если у тебя нет JetBrains Mono Nerd Font, поставь: paru -S ttf-jetbrains-mono-nerd
font=JetBrains Mono Nerd Font:size=12

# Количество строк в меню (высота окна)
lines=15

# Горизонтальный отступ (чтобы текст не прилипал к краям)
horizontal-pad=20
vertical-pad=10
inner-pad=10

# Размытие фона (backdrop blur) - красиво смотрится в Hyprland
blur=yes
blur-radius=5

[colors]
# Цветовая схема (подстрой под свою тему Hyprland)
background=1e1e2ecc
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
border=89b4faff

[border]
radius=12
width=2
